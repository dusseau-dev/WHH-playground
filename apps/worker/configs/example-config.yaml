# Example configuration file for pentest-agent
# Copy this file and modify it for your specific testing needs

# Description of the target environment (optional, max 500 chars)
description: "Next.js e-commerce app on PostgreSQL. Local dev environment — .env files contain local-only credentials, not deployed to production."

# Limit which vulnerability classes run end-to-end (optional, default: all five)
# When test_scopes is also set, both selections must resolve to the same classes.
# vuln_classes: [injection, xss, auth, authz, ssrf]

# Select granular checks in OWASP registry order (optional, default: every available check).
# test_scopes: [object-access, csrf, sql-nosql-injection, reflected-xss]

# Staging-only A09 detection validation is opt-in and may be selected alone.
# It sends one calibration request and ten fixed, inert simulations to a same-origin no-op endpoint.
# The endpoint must use valid TLS, never redirect, and return HTTP 204. The Splunk token requires
# search access only to the configured telemetry and alert indexes.
# test_scopes: [alerting-effectiveness]
# module_safety:
#   target_environment: staging
# detection_validation:
#   canary_path: /__shannon__/detection-simulation
#   minimum_detection_rate: 1
#   max_wait_seconds: 180
#   splunk:
#     management_url: https://splunk.example.com:8089
#     telemetry_index: waf_events
#     alert_index: security_alerts
#     telemetry_sourcetype: aws:waf      # optional
#     alert_sourcetype: notable          # optional
#     token: "replace-with-search-token" # secret; never exported in a profile

# Select live interaction surfaces (optional, default: browser and api-graphql).
# WebSocket assessment is visible in the UI but is not yet available.
# test_surfaces: [browser, api-graphql]

# Select assessment methods independently from vulnerability checks (optional).
# Passive exposure review is the only default. Supply-chain review requires source-assisted mode.
# assessment_modules: [passive-exposure, automated-dast, supply-chain]
#
# Active DAST and controlled load are fail-closed behind staging-only safety gates.
# Never label a production target as staging; target_environment is an operator assertion.
# module_safety:
#   target_environment: production       # production or staging
#   allow_active_dast: false              # staging only
#   acknowledge_load_risk: false          # required with the http-load-capacity module
#   max_requests_per_second: 2            # hard limit: 1-10
#   max_concurrency: 2                    # hard limit: 1-25
#   load_stage_duration_seconds: 60       # each 1 → 5 → 10 → 25 VU stage, capped above
#   load_error_rate_threshold: 0.05       # k6 abort threshold
#   load_p95_latency_ms_threshold: 2000   # k6 abort threshold

# Run safe, authorized demonstrations of confirmed findings (optional, default: true)
# safe_demonstration: true
# Legacy configs may still use exploit: true/false.

# Free-form engagement rules applied to analysis and safe-demonstration agents (optional).
# Example below is illustrative; edit, remove, or add sections as needed.
# rules_of_engagement: |
#   Forbidden techniques:
#   - No password brute-force or credential stuffing. Cap login attempts at 5 per account.
#   - ...
#
#   Operational:
#   - Throttle to under 5 requests per second per endpoint. Back off 60 seconds on any 429 response.
#   - ...
#
#   Data handling:
#   - Do not include actual values in deliverables — use placeholders like [order_id] or [user_email].
#   - ...

authentication:
  login_type: form  # Options: 'form' or 'sso'
  login_url: "https://example.com/login"
  credentials:
    username: "testuser"
    password: "testpassword"
    totp_secret: "JBSWY3DPEHPK3PXP"  # Optional TOTP secret for 2FA
  
    # Optional mailbox credentials for magic-link / email-OTP flows.
    # email_login:
    #   address: "inbox@example.com"
    #   password: "mailbox-password"
    #   totp_secret: "JBSWY3DPEHPK3PXP"

  # Natural language instructions for login flow
  login_flow:
    - "Type $username into the email field"
    - "Type $password into the password field"
    - "Click the 'Sign In' button"
    - "Enter $totp in the verification code field"
    - "Click 'Verify'"
  
  success_condition:
    type: url_contains  # Options: 'url_contains' or 'element_present'
    value: "/dashboard"

rules:
  # Supported types: url_path, subdomain, domain, method, header, parameter, code_path
  avoid:
    - description: "Do not test the marketing site subdomain"
      type: subdomain
      value: "www"
    
    - description: "Skip logout functionality"
      type: url_path
      value: "/logout"
    
    - description: "No DELETE operations on user API"
      type: url_path
      value: "/api/v1/users/*"
  
    # code_path values are repo-relative file paths or globs (e.g. "src/auth.ts", "test/**").
    # - description: "Test fixtures and specs (not production code)"
    #   type: code_path
    #   value: "test/**"
    #
    # - description: "Generated migrations"
    #   type: code_path
    #   value: "db/migrations/**"

  focus:
    - description: "Prioritize beta admin panel subdomain"
      type: subdomain
      value: "beta-admin"

    - description: "Focus on user profile updates"
      type: url_path
      value: "/api/v2/user-profile"

    # code_path values are repo-relative file paths or globs (e.g. "src/auth.ts", "routes/*.ts").
    # - description: "Express route handlers"
    #   type: code_path
    #   value: "routes/*.ts"
    #
    # - description: "Sequelize ORM model definitions"
    #   type: code_path
    #   value: "models/*.ts"

# Report filters applied by the report agent when assembling the final report (optional).
# Example below is illustrative; edit, remove, or add sections as needed.
# report:
#   min_severity: low
#   min_confidence: low
#   sarif: false  # Only emitted for safe-demonstration runs with fully validated triage.
#   guidance: |
#     Drop findings about missing security headers and rate-limit gaps.
#     ...

# Pipeline execution settings (optional)
# pipeline:
#   retry_preset: subscription          # 'default' or 'subscription' (6h max retry for rate limit recovery)
#   max_concurrent_pipelines: 2         # 1-5, default: 5 (reduce to lower API usage spikes)
